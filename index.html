<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO & Open Graph (IMPROVEMENT #1: Updated meta tags) -->
    <title>Daniel Alamo | Software Engineer</title>
    <meta name="description" content="Daniel Alamo - Software Engineer passionate about code, coffee, and music. Building great software with Laravel and modern web technologies." />
    <meta property="og:url" content="https://danielalamo.com" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Alamo | Software Engineer" />
    <meta property="og:description" content="Software Engineer passionate about code, coffee, and music. Building great software with Laravel and modern web technologies." />
    <meta property="og:image" content="https://danielalamo.com/pics/800/profile.jpg" />
    <meta name="twitter:card" content="summary" />
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
      /* CSS Variables for theming */
      :root {
        --bg-card: rgba(255, 255, 255, 0.85);
        --bg-card-blur: blur(20px);
        --text-primary: #1a1a2e;
        --text-secondary: #4a4a6a;
        --text-muted: #7a7a9a;
        --border-color: rgba(255, 255, 255, 0.3);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        --accent: #e74c3c;
        --link-hover: #3498db;
      }

      /* IMPROVEMENT #5: Dark mode support */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-card: rgba(30, 30, 50, 0.85);
          --text-primary: #f0f0f5;
          --text-secondary: #c0c0d0;
          --text-muted: #9090a0;
          --border-color: rgba(255, 255, 255, 0.1);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 400;
        line-height: 1.6;
      }

      body {
        background: url('background-laravel-beach.jpeg') center/cover no-repeat fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* IMPROVEMENT #2: Glassmorphism card */
      .card {
        background: var(--bg-card);
        backdrop-filter: var(--bg-card-blur);
        -webkit-backdrop-filter: var(--bg-card-blur);
        border-radius: 24px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        padding: 48px 56px;
        text-align: center;
        max-width: 420px;
        width: 100%;

        /* IMPROVEMENT #3: Entrance animation */
        animation: fadeInUp 0.8s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--border-color);
        margin-bottom: 20px;
        filter: grayscale(100%);
        transition: filter 0.4s ease, transform 0.4s ease;
      }

      /* IMPROVEMENT #4: Hover effects */
      .avatar:hover {
        filter: grayscale(0%);
        transform: scale(1.05);
      }

      .name {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
        letter-spacing: -0.02em;
      }

      .title {
        font-size: 1.25rem;
        font-weight: 300;
        color: var(--text-secondary);
        margin-bottom: 16px;
        letter-spacing: 0.02em;
      }

      .tagline {
        font-size: 1.5rem;
        margin-bottom: 28px;
        letter-spacing: 0.1em;
      }

      .heart {
        color: var(--accent);
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .social-link {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 1.25rem;
        transition: all 0.3s ease;
      }

      .social-link:hover {
        border-color: var(--link-hover);
        color: var(--link-hover);
        transform: translateY(-4px);
        box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
      }

      .nav-links {
        display: flex;
        justify-content: center;
        gap: 24px;
      }

      .nav-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 4px;
        position: relative;
        transition: color 0.3s ease;
      }

      .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--link-hover);
        transition: width 0.3s ease;
      }

      .nav-link:hover {
        color: var(--link-hover);
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .card {
          padding: 36px 28px;
        }
        
        .name {
          font-size: 1.5rem;
        }
        
        .title {
          font-size: 1.1rem;
        }
        
        .tagline {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img 
        src="https://avatars1.githubusercontent.com/u/6430396?v=4&s=460" 
        alt="Daniel Alamo" 
        class="avatar"
      />
      
      <h1 class="name">Daniel Alamo</h1>
      <p class="title">software engineer</p>
      
      <p class="tagline">
        💻 + ☕ + 🎵 = <span class="heart">❤️</span>
      </p>
      
      <nav class="social-links">
        <a href="https://linkedin.com/in/danalamo" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://github.com/danalamo" class="social-link" aria-label="GitHub" target="_blank" rel="noopener">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://www.buymeacoffee.com/danalamo" class="social-link" aria-label="Buy Me a Coffee" target="_blank" rel="noopener">
          <i class="fas fa-mug-hot"></i>
        </a>
      </nav>
      
      <nav class="nav-links">
        <a href="https://laravel.com" class="nav-link" target="_blank" rel="noopener">Laravel</a>
        <a href="https://laravel-news.com" class="nav-link" target="_blank" rel="noopener">News</a>
      </nav>
    </main>
  </body>
</html>
